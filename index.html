<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distrileco - Recetario SUPERARROZ</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; margin: 0; padding: 15px; text-align: center; }
        .card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); max-width: 450px; margin: auto; border-top: 8px solid #d32f2f; }
        .datetime { font-size: 11px; color: #555; font-weight: bold; margin-bottom: 15px; background: #eee; padding: 5px; border-radius: 5px; }
        h1 { color: #d32f2f; margin-bottom: 5px; font-size: 22px; }
        label { display: block; text-align: left; font-weight: bold; margin-top: 15px; font-size: 13px; color: #444; }
        select, input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
        .resultado { background: #fff4e5; padding: 15px; border-radius: 12px; margin: 15px 0; border: 1px solid #ff9800; }
        .resultado strong { color: #e65100; font-size: 20px; }
        .preparacion-box { text-align: left; background: #fdfdfd; padding: 15px; border-radius: 10px; margin-top: 15px; font-size: 14px; border-left: 5px solid #25d366; box-shadow: inset 0 0 5px rgba(0,0,0,0.05); }
        .btn-pedir { background-color: #25d366; color: white; border: none; padding: 18px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 20px; text-transform: uppercase; }
        .footer-text { font-size: 10px; color: #999; margin-top: 25px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="card">
    <div id="fecha-colombia" class="datetime">Cargando hora de Colombia...</div>
    <h1>SUPERARROZ 🍚</h1>
    <p style="font-size: 14px; color: #666;">Tu aliado en la cocina - Distrileco</p>

    <label>Tu nombre o número de contacto:</label>
    <input type="text" id="user-info" placeholder="Ej: Harold Marin - 311...">

    <label>¿Qué receta deseas preparar?</label>
    <select id="receta" onchange="calcular()">
        <option value="80">Arroz Blanco Tradicional (80g p/p)</option>
        <option value="100">Arroz con Pollo Especial (100g p/p)</option>
        <option value="90">Arroz Atollado Valluno (90g p/p)</option>
    </select>

    <label>¿Para cuántas personas?</label>
    <input type="number" id="comensales" value="1" min="1" oninput="calcular()">

    <div class="resultado">
        Necesitas: <strong><span id="gramos">80</span>g</strong><br>
        Costo SUPERARROZ: <strong>$<span id="costo">280</span></strong>
    </div>

    <div id="detalle-preparacion" class="preparacion-box"></div>

    <button class="btn-pedir" onclick="enviarWhatsApp()">🚀 Enviar Pedido y Receta</button>
    
    <p class="footer-text">
        <strong>App desarrollada por Vibras Positivas</strong><br>
        Derecho de autor (3117700431)<br>
        Distribuidora Distrileco - Caucasia, Antioquia
    </p>
</div>

<script>
    const PRECIO_GRAMO = 3.5; 

    const datosRecetas = {
        "80": {
            nombre: "Arroz Blanco Tradicional",
            ingredientes: "SUPERARROZ, 2 tazas de agua por 1 de arroz, aceite, sal y ajo.",
            pasos: "Calienta el aceite, sofríe el arroz con ajo, añade el agua y sal. Deja secar y tapa a fuego mínimo por 15 min."
        },
        "100": {
            nombre: "Arroz con Pollo Especial",
            ingredientes: "SUPERARROZ, pechuga desmechada, verduras (arveja, zanahoria), pimentón y caldo de pollo.",
            pasos: "Sofríe las verduras con el arroz, añade el caldo (2.5 tazas por 1 de arroz) y el pollo. Cocina hasta que esté tierno."
        },
        "90": {
            nombre: "Arroz Atollado Valluno",
            ingredientes: "SUPERARROZ, cerdo, pollo, papa amarilla, hogao y mucho cilantro.",
            pasos: "Cocina las carnes con el arroz y abundante líquido. La clave es que quede húmedo (tipo risotto) y bien sazonado."
        }
    };

    function actualizarReloj() {
        const ahora = new Date();
        const opciones = { 
            timeZone: 'America/Bogota', 
            weekday: 'long', 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric',
            hour: '2-digit', 
            minute: '2-digit', 
            second: '2-digit' 
        };
        document.getElementById('fecha-colombia').innerText = ahora.toLocaleDateString('es-CO', opciones).toUpperCase();
    }

    function calcular() {
        let r = document.getElementById('receta').value;
        let p = document.getElementById('comensales').value;
        let totalG = r * p;
        let totalC = totalG * PRECIO_GRAMO;

        document.getElementById('gramos').innerText = totalG;
        document.getElementById('costo').innerText = Math.round(totalC).toLocaleString('es-CO');

        let info = datosRecetas[r];
        document.getElementById('detalle-preparacion').innerHTML = `
            <strong>📝 Ingredientes:</strong><br>${info.ingredientes}<br><br>
            <strong>👨‍🍳 Pasos:</strong><br>${info.pasos}
        `;
    }

    function enviarWhatsApp() {
        let contacto = document.getElementById('user-info').value;
        let recetaVal = document.getElementById('receta').value;
        let personas = document.getElementById('comensales').value;
        let gramos = document.getElementById('gramos').innerText;
        let costo = document.getElementById('costo').innerText;
        let fecha = document.getElementById('fecha-colombia').innerText;
        
        let infoReceta = datosRecetas[recetaVal];

        if(!contacto) {
            alert("Por favor, ingresa tu nombre o número para el pedido.");
            return;
        }

        let distrilecoNum = "3117700431"; 
        
        // Mensaje estructurado para el vendedor
        let mensaje = `*NUEVO PEDIDO - DISTRILECO*\n`;
        mensaje += `━━━━━━━━━━━━━━━\n`;
        mensaje += `👤 *Cliente:* ${contacto}\n`;
        mensaje += `📅 *Fecha:* ${fecha}\n`;
        mensaje += `🍚 *Producto:* SUPERARROZ\n`;
        mensaje += `🍛 *Plato:* ${infoReceta.nombre}\n`;
        mensaje += `👥 *Personas:* ${personas}\n`;
        mensaje += `⚖️ *Cantidad:* ${gramos}g\n`;
        mensaje += `💰 *Costo base:* $${costo}\n`;
        mensaje += `━━━━━━━━━━━━━━━\n`;
        mensaje += `📖 *RECETA SOLICITADA:*\n`;
        mensaje += `*Ingredientes:* ${infoReceta.ingredientes}\n`;
        mensaje += `*Preparación:* ${infoReceta.pasos}\n`;
        mensaje += `━━━━━━━━━━━━━━━\n`;
        mensaje += `_Enviado desde la App de Vibras Positivas_`;

        window.open(`https://wa.me/${distrilecoNum}?text=${encodeURIComponent(mensaje)}`);
    }

    setInterval(actualizarReloj, 1000);
    actualizarReloj();
    calcular();
</script>

</body>
</html>
